<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Centro de formación</title>

    <link rel="stylesheet" href="CSS/bootstrap.min.css">
    <link rel="stylesheet" href="CSS/styles.css">

    <script src="./JS/cursos.js" defer></script>
</head>
<body>
    <header> 
        <div class="logo">
            <img src="./IMG/default_min.webp" width="64" alt="Logo">
            <a href="index.html">Centro de Formación</a>
        </div>
        <nav>
            <ul>
                <li><a href="cursos.html">Cursos</a></li>
                <li><a href="docentes.html">Docentes</a></li>
                <li><a href="aulas.html">Aulas</a></li>
                <li><a href="mis_matriculas.html">Mis matriculas</a></li>
                <li><a href="accesibilidad.html">Accesibilidad</a></li>
                <li><a href="administracion.html">Administración</a></li>
            </ul>
        </nav>
        <button class="btn btn-danger fw-bold">Cerrar Sesión</button>
    </header>

    <div class="miga">
        <a href="index.html">Inicio</a>
        <p>></p>
        <a href="cursos.html">Cursos</a>
    </div>

    <main>
        <h1>Cursos</h1>
        
        <div class="listaCursos"></div>

        
        <aside>
            <h3>Panel de gestión</h3>
            <form id="panel">
                <label for="name">Nombre:</label>
                <input type="text" name="name" id="name" placeholder="Nombre del curso">
                
                <label for="desc">Descripcion:</label>
                <textarea name="desc" id="desc" placeholder="Descripción del curso"></textarea>
                
                <label for="time">Turno:</label>
                <select name="time" id="time">
                    <option value="0">Mañana</option>
                    <option value="1">Mediodía</option>
                    <option value="2">Tarde</option>
                </select>
                
                <label for="cap">Plazas:</label>
                <input type="number" name="cap" id="cap">

                <input class="btn btn-success fw-bold" type="submit" value="Crear">
            </form>

            <div class="buttons">
                <button class="btn btn-primary fw-bold" id="btn_borrar">Borrar Curso</button>
                <button class="btn btn-primary fw-bold" id="btn_ordenar">Ordenar cursos</button>
            </div>
        </aside>
    </main>
    
    
    <footer>
        <p>&copy; Todos los derechos reservados</p>
    </footer>
</body>
</html>
