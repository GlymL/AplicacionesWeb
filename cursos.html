    <div class="miga">
        <a href="index.html">Inicio</a>
        <p>></p>
        <a href="cursos.html">Cursos</a>
    </div>

    <main class="main-cursos">
        <h1>Cursos</h1>
        
        <div class="listaCursos"></div>

        
        <aside>
            <h3>Panel de gestión</h3>
            <form id="panel">
                <div class="input-group">
                    <label class="input-group-text fw-bold" for="name">Nombre:</label>
                    <input class="form-control" type="text" name="name" id="name" placeholder="Nombre del curso" required>
                </div>
                
                <label class="fw-bold" for="desc">Descripcion:</label>
                <textarea class="form-control" name="desc" id="desc" placeholder="Descripción del curso" required></textarea>
                
                <div class="input-group">
                    <label class="input-group-text fw-bold" for="time">Turno:</label>
                    <select class="form-control" name="time" id="time" required>
                        <option selected value="0">Mañana</option>
                        <option value="1">Mediodía</option>
                        <option value="2">Tarde</option>
                    </select>
                </div>
                
                <div class="input-group">
                    <label class="input-group-text fw-bold" for="cap">Plazas:</label>
                    <input class="form-control" type="number" name="cap" id="cap" min="0" value="0" required>
                </div>

                <input class="btn btn-success fw-bold" type="submit" value="Crear">
            </form>

            <div class="buttons">
                <button class="btn btn-primary fw-bold" id="btn_borrar">Borrar Curso</button>
                <button class="btn btn-primary fw-bold" id="btn_ordenar">Ordenar cursos</button>
            </div>
        </aside>
    </main>
    
    
    <footer>
